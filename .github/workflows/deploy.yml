name: Publish GINLANG to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      # The per-post share images are rasterized from an SVG template at build time;
      # the Chinese titles need a CJK font present on the runner.
      - name: Install CJK fonts for share images
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install, build, and upload the site
        uses: withastro/action@v6
      - name: Verify content states, routes, resources, and quote library
        run: |
          npm run check:content-state
          npm run check:image-loading
          npm run check:site
          npm run check:library

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v5
